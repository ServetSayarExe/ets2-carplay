# Yeni sürüm: app/package.json'daki "version"ı artır, "v2.5.1" gibi bir etiket (tag) gönder
# ya da Actions sekmesinden bu iş akışını elle çalıştır. Kurulum dosyası otomatik derlenip yayınlanır,
# kullanıcıların uygulaması kendini günceller.
name: Sürüm derle ve yayınla

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sürümü hazırla
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=v$(node -p "require('./package.json').version")
          echo "V=$V" >> $GITHUB_ENV
          # ayni etiketli eski ya da yarim kalmis surumleri temizle
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.tag_name==\"$V\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          git ls-remote --exit-code --tags origin "refs/tags/$V" >/dev/null || { git tag "$V" && git push origin "$V"; }
          git log -1 --pretty=%B | sed '/^Co-Authored-By/d;/^Claude-Session/d' > notes.txt
          gh release create "$V" --draft --title "${V#v}" --notes-file notes.txt
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Sürümü yayınla
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$V" --draft=false --latest
